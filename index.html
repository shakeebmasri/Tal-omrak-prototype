<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style><title>رحلة طال عمرك</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, one screen at a time, brand indigo on ivory; numbers in Playfair, Arabic in Noto Naskh. */
:root{
  --bg:#F6F0E3; --surface:#FFFFFF; --ink:#1D1069; --ink-2:#3B3380; --muted:#6F6A9C;
  --accent:#7E57FD; --lav:#ACA6E1; --deep:#221196; --pink:#F86080; --line:#E6E0D2;
  --good:#2E8B6B; --warn:#C98A1B; --act:#F86080;
  --hero-bg:#221196; --hero-fg:#F6F0E3; --hero-sub:#ACA6E1;
  --font-body:"Noto Naskh Arabic","Noto Naskh Arabic UI",Georgia,serif;
  --font-num:"Noto Naskh Arabic","Noto Naskh Arabic UI",Georgia,serif;
  --font-display:"Playfair Display",Georgia,serif;
  --font-latin:"Inter",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.7;direction:rtl}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.logo{display:flex;align-items:baseline;gap:10px}
.logo .wm{font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--ink);letter-spacing:-.01em;direction:ltr}
.logo .ar{font-weight:700;font-size:20px;color:var(--ink)}
.logo .dot{color:var(--accent)}

.stage{font-size:12px;color:var(--muted);letter-spacing:.04em}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
h1{font-size:26px;line-height:1.35;margin:0 0 8px;text-wrap:balance;font-weight:700}
h2{font-size:20px;margin:22px 0 8px;font-weight:600}
p{margin:0 0 12px;color:var(--ink-2)}
.why{font-size:14px;color:var(--muted);margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px;margin:8px 0 18px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer;font:inherit;color:var(--ink);text-align:right;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--lav)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.opt:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.opt .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.opt.sel .tick{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font:inherit;font-size:17px;font-weight:600;cursor:pointer;width:100%}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.slider{width:100%;accent-color:var(--accent)}
.val{font-family:var(--font-num);font-size:34px;font-weight:700;text-align:center;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.unit{text-align:center;color:var(--muted);font-size:14px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:0;font-size:15px}
.age{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;margin:12px 0 18px}
.age .n{font-family:var(--font-num);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.age .l{font-size:13px;color:var(--muted)}
.age .est .n{color:var(--accent)}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.score:last-child{border-bottom:0}
.score .name{font-weight:600}
.score .sub{font-size:13px;color:var(--muted)}
.pill{font-size:13px;padding:4px 12px;border-radius:999px;font-weight:600;white-space:nowrap}
.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.act{background:color-mix(in srgb,var(--act) 15%,transparent);color:var(--act)}
.price{font-family:var(--font-num);font-size:44px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.small{font-size:14px;color:var(--muted)}
.list{padding:0;margin:8px 0 16px;list-style:none;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink-2)}
.list li::before{content:"✓";color:var(--good);font-weight:700;flex:none}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 16px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.cat .t{font-weight:600;font-size:15px}
.cat .s{font-size:12px;color:var(--muted)}
.cat .dots{display:flex;gap:4px;margin-top:6px}
.cat .dots i{width:10px;height:10px;border-radius:50%;display:block}
.dot-good{background:var(--good)}.dot-warn{background:var(--warn)}.dot-act{background:var(--act)}
.ring{display:grid;place-items:center;margin:8px auto 14px;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);position:relative}
.ring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font-family:var(--font-num);font-size:44px;font-weight:700;color:var(--ink)}
.ring small{position:absolute;bottom:30px;font-size:12px;color:var(--muted)}
.timeline{list-style:none;padding:0;margin:8px 0 16px;border-right:2px solid var(--line)}
.timeline li{padding:0 18px 14px 0;position:relative;font-size:15px}
.timeline li::before{content:"";position:absolute;right:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--lav);border:2px solid var(--bg)}
.timeline li.now::before{background:var(--accent)}
.timeline b{display:block;color:var(--ink)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:18px}
.back{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:8px}
.dev{position:fixed;bottom:max(10px,env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));z-index:5}
.dev select{font:inherit;font-size:12px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:22px;padding:26px 20px;margin-bottom:16px}
.hero h1{color:var(--hero-fg);font-size:34px}
.hero p{color:var(--hero-sub)}
.hero .tag{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:var(--hero-fg)}
.tag{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink-2);margin:0 0 6px 6px}
.safety{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1.5px solid var(--accent)}
.vital{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vital label{font-size:13px;color:var(--muted);display:block}
.vital input{width:100%;box-sizing:border-box;font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.flash{animation:pop .5s ease}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.bar i{transition:none}}
/* reveal + bio-age moments */
.reveal{background:linear-gradient(160deg,var(--ink),var(--deep) 70%,#3A2CB8);color:var(--hero-fg);border-radius:24px;padding:22px 18px 18px;margin:4px 0 16px;position:relative;overflow:hidden}
.reveal::before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 60%)}
.reveal .lbl{font-size:13px;color:var(--hero-sub);letter-spacing:.03em}
.reveal .big{font-family:var(--font-num);font-size:84px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.reveal .big small{font-size:22px;font-weight:600;color:var(--hero-sub);margin-inline-start:6px}
.reveal .vs{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:6px}
.reveal .id{text-align:left}
.reveal .id .n{font-family:var(--font-num);font-size:34px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.delta{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:999px;font-weight:600;font-size:15px;background:rgba(255,255,255,.14);color:#fff}
.delta.up{background:rgba(255,120,110,.28)} .delta.down{background:rgba(90,210,160,.28)}
.gauge{display:block;width:100%;height:auto;margin:6px 0 0}
.gauge .track{stroke:rgba(255,255,255,.18);stroke-width:14;fill:none;stroke-linecap:round}
.gauge .fill{stroke:#fff;stroke-width:14;fill:none;stroke-linecap:round;transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.gauge .needle{stroke:#fff;stroke-width:3;stroke-linecap:round;transform-origin:150px 150px;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.gauge text{fill:var(--hero-sub);font-size:12px;font-family:var(--font-body)}
.finding{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;border-inline-start-width:5px}
.finding.up{border-inline-start-color:var(--warn)} .finding.down{border-inline-start-color:var(--good)} .finding.neutral{border-inline-start-color:var(--lav)}
.finding .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--accent)}
.finding .ico svg{width:24px;height:24px}
.finding h3{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.finding h3 .yrs{font-family:var(--font-num);font-size:15px;font-weight:700;white-space:nowrap}
.finding.up .yrs{color:var(--warn)} .finding.down .yrs{color:var(--good)}
.finding p{margin:0;font-size:14px;color:var(--ink-2)}
.finding b{color:var(--accent);font-weight:600}
.ageline{position:relative;height:92px;margin:18px 4px 6px}
.ageline .rail{position:absolute;left:0;right:0;top:46px;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--good),var(--warn) 55%,var(--act))}
.ageline .mk{position:absolute;top:0;transform:translateX(50%);text-align:center;width:96px;transition:right 1.2s cubic-bezier(.2,.8,.2,1)}
.ageline .mk .n{font-family:var(--font-num);font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.ageline .mk .l{font-size:11px;color:var(--muted);white-space:nowrap}
.ageline .mk i{display:block;width:14px;height:14px;border-radius:50%;margin:6px auto 0;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.ageline .mk.bio{top:auto;bottom:0}
.ageline .mk.bio i{margin:0 auto 6px;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.ageline .mk.bio .n{color:var(--accent);font-size:28px}
.ageline .mk.id i{background:var(--ink)} .ageline .mk.est i{background:var(--lav)}
.bioCard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.bioCard .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bioCard .head b{font-size:16px}
.bioCard .head .chip{font-size:13px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
.ring{transition:--p 1.4s}
.cat .barr{height:6px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden}
.cat .barr i{display:block;height:100%;background:var(--accent);width:0;transition:width 1s ease}
@media (prefers-reduced-motion:reduce){.gauge .fill,.gauge .needle,.ageline .mk,.cat .barr i{transition:none}}


/* ---- design pass v2 ---- */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px 380px at 90% -8%,color-mix(in srgb,var(--lav) 30%,transparent),transparent 70%)}
.top{padding:6px 0 10px}
.stage{font-size:12px;color:var(--pink);font-weight:600;background:color-mix(in srgb,var(--pink) 10%,transparent);padding:4px 12px;border-radius:999px}
.bar{height:6px;background:color-mix(in srgb,var(--lav) 35%,transparent);border-radius:6px}
.bar i{background:var(--accent)}
h1{font-size:28px;line-height:1.4}
.why{font-size:14.5px;line-height:1.7}
.opt{border-radius:18px;padding:16px 18px;box-shadow:0 1px 0 rgba(29,16,105,.03);transition:transform .12s,border-color .15s,background .15s,box-shadow .15s}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--accent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface));box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 18%,transparent)}
.opt .tick{width:24px;height:24px;transition:transform .15s}
.opt.sel .tick{transform:scale(1.08)}
.btn{border-radius:16px;padding:16px 22px;letter-spacing:.01em;transition:transform .12s,box-shadow .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.ghost{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent)}
.card,.bioCard{border-radius:20px;box-shadow:0 10px 30px rgba(29,16,105,.06)}
.card h3{font-size:17px}
.val{font-size:52px;color:var(--accent)}
.slider{height:6px;margin:6px 0}
.hint-eyebrow{display:inline-block;font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.modintro{position:relative;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--lav) 35%,var(--surface)),var(--surface));border:1px solid var(--line);border-radius:24px;padding:28px 20px 22px;margin-bottom:18px}
.modintro svg{position:absolute;inset:auto -30px -40px auto;width:220px;height:220px;opacity:.55}
.modintro .tag{background:var(--accent);color:#fff;border-color:transparent}
.modintro h1{font-size:34px;margin-top:6px}
.mcard{position:relative;aspect-ratio:1.6;max-width:100%;border-radius:20px;padding:18px 20px;color:#F6F0E3;background:linear-gradient(135deg,#1D1069 0%,#221196 70%,#3A2CB8 100%);box-shadow:0 18px 40px rgba(29,16,105,.28);margin:6px 0 16px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.mcard::before{content:"";position:absolute;inset:-60% auto auto -20%;width:70%;height:160%;background:linear-gradient(120deg,rgba(255,255,255,.14),transparent 60%);transform:rotate(12deg)}
.mcard .l1{display:flex;justify-content:space-between;align-items:center}
.mcard .brand{font-weight:700;font-size:20px}.mcard .brand span{color:#C9B8FF}
.mcard .en{font-family:var(--font-display);font-weight:700;font-size:18px;opacity:.95;direction:ltr;display:inline-block}
.mcard .chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#E9D8A6,#C9A95C);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.mcard .name{font-size:13px;color:#C9B8FF;letter-spacing:.04em}
.mcard .big{font-size:22px;font-weight:700;line-height:1.3}
.mcard .l3{display:flex;justify-content:space-between;font-family:var(--font-latin);font-size:13px;opacity:.9;font-variant-numeric:tabular-nums}
.cat{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px;transition:transform .12s,box-shadow .15s;box-shadow:0 6px 18px rgba(29,16,105,.05)}
.cat:active{transform:scale(.985)}
.cat .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--accent);margin-bottom:6px}
.cat .ic svg{width:17px;height:17px}
.timeline{border-right-width:3px;border-right-color:color-mix(in srgb,var(--lav) 60%,transparent);margin-right:8px}
.timeline li{padding:0 22px 18px 0}
.timeline li::before{right:-9px;top:8px;width:15px;height:15px;background:var(--surface);border:3px solid var(--lav);box-shadow:none}
.timeline li.now::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.timeline b{font-size:13px;color:var(--accent);letter-spacing:.04em;margin-bottom:2px}
.timeline li.now b{font-size:14px}
.score .name{font-size:15.5px}
.pill{padding:5px 13px}
.flash{animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.nav{padding-top:22px}
.back{font-size:14px}
.dev select{box-shadow:0 6px 18px rgba(29,16,105,.12)}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

/* bio-age hero, WHOOP-style */
.bio{position:relative;overflow:hidden;border-radius:26px;padding:24px 20px 20px;margin:4px 0 16px;color:var(--hero-fg);background:radial-gradient(120% 90% at 100% 0%,#4A33B8 0%,#1D1069 55%,#140B4D 100%);box-shadow:0 20px 50px rgba(29,16,105,.35)}
.bio::after{content:"";position:absolute;inset:auto auto -120px -80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(126,87,253,.45),transparent 65%);pointer-events:none}
.bio .eyebrow{font-size:13px;color:var(--hero-sub);letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.bio .eyebrow .chip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#fff;letter-spacing:.04em}
.bio .num{font-family:var(--font-num);font-size:96px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:10px 0 2px;color:#fff;text-shadow:0 0 40px rgba(169,139,255,.45)}
.bio .num small{font-size:28px;font-weight:600;color:var(--hero-sub);margin-inline-start:6px;letter-spacing:0}
.bio .verdict{font-size:17px;color:#fff;margin:0 0 18px}
.bio .verdict b{color:#C9B8FF}
.pace{margin-top:6px}






.bio .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.bio .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.bio .stat .k{font-size:12px;color:var(--hero-sub)}
.bio .stat .v{font-family:var(--font-num);font-size:24px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.bio .foot{font-size:12.5px;color:var(--hero-sub);margin:14px 0 0;line-height:1.6}

/* bio-age hero v3 (WHOOP-like ring) */
.bio{position:relative;overflow:hidden;border-radius:28px;padding:18px 18px 18px;margin:4px 0 16px;color:var(--hero-fg);background:radial-gradient(90% 60% at 50% 20%,#2A1C86 0%,#17104F 60%,#110A3F 100%);box-shadow:0 24px 60px rgba(17,10,63,.45)}
.bio .eyebrow{font-size:12px;color:var(--hero-sub);letter-spacing:.14em;text-align:center;text-transform:uppercase}
.ringwrap{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:6px auto 2px}
.ringwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.ringwrap .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringwrap .num{font-family:var(--font-num);font-size:64px;font-weight:700;line-height:1;color:#fff;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(169,139,255,.5)}
.ringwrap .cap{font-size:13px;color:var(--hero-sub);letter-spacing:.12em;margin-top:6px}
.ringwrap .verdict{font-size:17px;color:#C9B8FF;margin-top:10px;font-weight:600}
.pace{margin-top:14px}
.pace .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

<script>
/* ---------- state ---------- */
const S = { a:{}, step:0, qi:0, di:0, vitals:{}, chosenAddon:null, booking:{} };
const $ = s=>document.querySelector(s);
const screen=$('#screen'), bar=$('#bar'), stageLbl=$('#stageLbl'), hint=$('#hint'), backBtn=$('#backBtn');

/* ---------- questions ---------- */
const Q = (id,q,opts,extra={})=>({id,q,opts,...extra});
const SCALE5=['أبداً','نادراً','أحياناً','كثير','دايماً'];
const SCALE4=['أبداً','كم يوم','أكثر من نص الأيام','تقريباً كل يوم'];

const QUICK=[
 Q('arch','وش أقرب وصف لك اليوم؟',['أبي أعرف جسمي بالتفصيل','أبي أحد يقول لي وش أسوي','أحس جسمي يبي انتباه','بدأت أهتم بصحتي وأبي أبدأ صح'],{why:'ما فيه جواب غلط.'}),
 Q('age','كم عمرك؟',null,{type:'slider',min:18,max:80,def:38,unit:'سنة',why:'كل مؤشر نقراه على قد عمرك.'}),
 Q('sex','أنت؟',['رجل','امرأة']),
 Q('height','طولك؟',null,{type:'slider',min:140,max:210,def:172,unit:'سم'}),
 Q('weight','وزنك تقريباً؟',null,{type:'slider',min:40,max:180,def:84,unit:'كجم'}),
 Q('waist','محيط خصرك؟ إذا ما تدري، تخطّاه ونقيسه لك بالزيارة',null,{type:'slider',min:60,max:150,def:95,unit:'سم',skip:true,why:'الخصر يقول أكثر من الوزن.'}),
 Q('sleep','كم ساعة {تنام|تنامين} فعلياً بالليل، أغلب الأيام؟',['أقل من ٥','٥–٦','٦–٧','٧–٨','أكثر من ٨'],{why:'النوم يبان بالسكر والهرمونات قبل لا يبان على وجهك.'}),
 Q('active','كم يوم في الأسبوع {تتحرك|تتحركين} حركة ترفع نبضك نص ساعة أو أكثر؟',['٠','١–٢','٣–٤','٥+']),
 Q('sweet','كم مرة في الأسبوع {تشرب|تشربين} غازيات أو عصائر محلاة أو مشروبات طاقة؟',['ولا مرة','١–٢','٣–٥','كل يوم','أكثر من مرة في اليوم']),
 Q('smoke','{تدخن|تدخنين}؟ (سجائر، شيشة، فيب)',['لا، أبداً','تركت','أحياناً','كل يوم'],{why:'بدون حكم، بس عشان نقرا نتايجك صح.'}),
 Q('stress','في آخر شهر، كم مرة {حسيت|حسيتي} إن الأمور أكثر من طاقتك؟',SCALE5),
 Q('fam','أحد من أهلك القريبين (أبوك، أمك، إخوانك) عنده:',['سكري','جلطة قلب أو دماغ قبل سن ٦٠','ضغط','كولسترول عالي','سرطان','فقر دم وراثي','ولا واحد'],{multi:true,why:'ما تقدر تغيّره، بس تقدر تراقبه قبلهم.'}),
];

const DEEP=[
 {mod:'نومك', why:'ليش نسأل: عشان نفهم نومك، مو بس كم ساعة.'},
 Q('sl_reg','{تنام وتصحى|تنامين وتصحين} في نفس الوقت تقريباً؟',['دايماً','أغلب الأيام','يتغير كثير','ما فيه نظام']),
 Q('sl_lat','كم {تاخذ|تاخذين} لين {تغفى|تغفين}؟',['أقل من ١٥ دقيقة','١٥–٣٠','٣٠–٦٠','أكثر من ساعة']),
 Q('sl_fresh','{تصحى مرتاح|تصحين مرتاحة}؟',['دايماً','غالباً','أحياناً','نادراً']),
 Q('sl_snore','أحد قال لك إن شخيرك عالي؟',['نعم','لا','ما أدري']),
 Q('sl_apnea','أحد لاحظ {إنك توقف التنفس وأنت نايم|إنك توقفين التنفس وأنتِ نايمة}؟',['نعم','لا','ما أدري']),
 Q('sl_day','{تحس|تحسين} بنعاس أو تعب في النهار حتى لو {نمت|نمتي} زين؟',['كل يوم','أغلب الأيام','أحياناً','نادراً']),
 {mod:'حركتك', why:'ليش نسأل: الحركة تحرّك الأنسولين والدهون والمزاج، كلهم مع بعض.'},
 Q('mv_vig','كم يوم في الأسبوع {تسوي|تسوين} نشاط قوي (جري، كرة، تمرين شديد)؟',['٠','١','٢','٣','٤','٥+']),
 Q('mv_mod','كم يوم {تسوي|تسوين} نشاط متوسط (مشي سريع، سباحة، دراجة)؟',['٠','١','٢','٣','٤','٥+']),
 Q('mv_sit','كم ساعة {تقعد|تقعدين} في اليوم (مكتب، سيارة، جوال، تلفزيون)؟',['أقل من ٤','٤–٦','٦–٨','٨–١٠','أكثر من ١٠']),
 Q('mv_res','{تسوي|تسوين} تمارين مقاومة (أوزان، أجهزة، وزن الجسم)؟',['لا','مرة في الأسبوع','٢–٣','٤+']),
 {mod:'أكلك', why:'ليش نسأل: الأكل أكبر شي يحرّك نتايجك في ستة شهور.'},
 Q('nu_veg','كم حصة خضار {تاكل|تاكلين} في اليوم؟ (الحصة = قد كف يدك)',['٠','١','٢','٣+']),
 Q('nu_fruit','وكم حصة فواكه؟',['٠','١','٢','٣+']),
 Q('nu_meat','لحم أحمر أو لحوم مصنعة، كم مرة في الأسبوع؟',['أقل من مرة','١–٢','٣–٥','كل يوم']),
 Q('nu_fish','سمك، كم مرة في الأسبوع؟',['ولا مرة','١','٢','٣+']),
 Q('nu_out','أكل من برا أو توصيل، كم مرة بالأسبوع؟',['أقل من مرة','١–٢','٣–٥','كل يوم','أكثر من مرة في اليوم']),
 Q('nu_dates','التمر، كم حبة في اليوم تقريباً؟',['ولا واحدة','١–٣','٤–٧','أكثر من ٧']),
 {mod:'راحة بالك', why:'ليش نسأل: التوتر والمزاج يبانون بالغدة والسكر والنوم، وجواباتك هنا ما يشوفها إلا طبيبك.'},
 Q('ps1','في آخر شهر، كم مرة {حسيت إنك ما تقدر تتحكم|حسيتي إنك ما تقدرين تتحكمين} في الأشياء المهمة في حياتك؟',SCALE5),
 Q('ps2','كم مرة {حسيت بثقة إنك قادر تتعامل|حسيتي بثقة إنك قادرة تتعاملين} مع مشاكلك؟',SCALE5,{rev:true}),
 Q('ps3','كم مرة {حسيت|حسيتي} إن الأمور ماشية مثل ما {تبي|تبين}؟',SCALE5,{rev:true}),
 Q('phq1','في آخر أسبوعين، كم مرة حسيت إنك ما لك خلق لشي أو ما تستمتع بشي؟',SCALE4),
 Q('phq2','وكم مرة {حسيت|حسيتي} بضيق أو اكتئاب أو فقدان أمل؟',SCALE4),
 Q('phq3','صعوبة في النوم أو نوم زايد؟',SCALE4,{gate:'phq'}),
 Q('phq4','تعب أو قلة طاقة؟',SCALE4,{gate:'phq'}),
 Q('phq5','قلة شهية أو أكل زايد؟',SCALE4,{gate:'phq'}),
 Q('phq6','شعور سيء تجاه نفسك، أو {إنك فاشل أو خذلت|إنك فاشلة أو خذلتي} أهلك؟',SCALE4,{gate:'phq'}),
 Q('phq7','صعوبة في التركيز؟',SCALE4,{gate:'phq'}),
 Q('phq8','بطء في الحركة أو الكلام، أو العكس: توتر وحركة زايدة؟',SCALE4,{gate:'phq'}),
 Q('phq9','أفكار إنك أحسن لو ما كنت موجود، أو إنك تأذي نفسك؟',SCALE4,{gate:'phq',safety:true}),
 Q('gad1','في آخر أسبوعين، كم مرة {حسيت|حسيتي} بتوتر أو قلق أو على أعصابك؟',SCALE4),
 Q('gad2','وكم مرة {ما قدرت توقف القلق أو تتحكم|ما قدرتي توقفين القلق أو تتحكمين} فيه؟',SCALE4),
 Q('gad3','قلق زايد على أشياء مختلفة؟',SCALE4,{gate:'gad'}),
 Q('gad4','صعوبة في الاسترخاء؟',SCALE4,{gate:'gad'}),
 Q('gad5','توتر لدرجة {إنك ما تقدر تقعد|إنك ما تقدرين تقعدين} في مكانك؟',SCALE4,{gate:'gad'}),
 Q('gad6','سرعة انزعاج أو عصبية؟',SCALE4,{gate:'gad'}),
 Q('gad7','خوف إن شي سيء بيصير؟',SCALE4,{gate:'gad'}),
 Q('lo1','كم مرة {تحس|تحسين} إنك ما عندك أحد {تكلمه|تكلمينه}؟',['نادراً','أحياناً','كثير']),
 Q('lo2','كم مرة {تحس إنك معزول|تحسين إنك معزولة} عن الناس؟',['نادراً','أحياناً','كثير']),
 Q('lo3','كم مرة {تحس إنك متروك|تحسين إنك متروكة} برا؟',['نادراً','أحياناً','كثير']),
 {mod:'تاريخك الصحي', why:'ليش نسأل: عشان طبيبك يقرا نتايجك على وضعك أنت، مو على وضع أحد ثاني.'},
 Q('dx','عندك تشخيص من قبل بأي وحدة من هذي؟',['سكري','ما قبل السكري','ضغط','كولسترول','غدة درقية','فقر دم','كبد دهني','تكيس مبايض','ولا واحد'],{multi:true}),
 Q('meds','{تاخذ|تاخذين} أدوية على طول؟',['لا','ضغط','سكر (ميتفورمين)','كولسترول (ستاتين)','غدة','حموضة','أخرى'],{multi:true}),
 Q('last','متى آخر تحليل دم شامل {سويته|سويتيه}؟',['ما عمري','أكثر من سنتين','١–٢ سنة','هذي السنة']),
 Q('bp','{تدري|تدرين} ضغطك عادةً كم؟',['طبيعي','مرتفع','منخفض','ما أدري']),
 Q('w_cycle','دورتك منتظمة؟',['منتظمة','غير منتظمة','انقطعت (سن اليأس)','ما تجي بسبب مانع حمل'],{only:'امرأة'}),
 Q('w_preg','ناوية على حمل السنة الجاية؟',['نعم','لا','ما أدري'],{only:'امرأة'}),
 {mod:'صحة الرجل', why:'جواباتك هنا خاصة وما يشوفها إلا طبيبك. تقدر تتخطى هالجزء بضغطة وحدة.', only:'رجل', skippable:'men'},
 Q('m_conf','كيف تقيّم ثقتك في قدرتك على الانتصاب والحفاظ عليه؟',['منخفضة جداً','منخفضة','متوسطة','عالية','عالية جداً'],{only:'رجل',sk:'men'}),
 Q('m_firm','عند الإثارة، كم مرة يكون الانتصاب كافياً للإيلاج؟',['أبداً أو تقريباً أبداً','قليلاً','أحياناً','أغلب الأوقات','دايماً'],{only:'رجل',sk:'men'}),
 Q('m_keep','كم مرة تقدر تحافظ على الانتصاب حتى النهاية؟',['أبداً أو تقريباً أبداً','قليلاً','أحياناً','أغلب الأوقات','دايماً'],{only:'رجل',sk:'men'}),
 Q('m_energy','تحس إن طاقتك أو رغبتك أو قوتك قلّت عن قبل؟',['لا','نعم، شوي','نعم، واضح'],{only:'رجل',sk:'men'}),
 Q('m_noct','تقوم تتبول بالليل أكثر من مرة؟',['لا','مرة','٢–٣','أكثر'],{only:'رجل',sk:'men'}),
 {mod:'أهدافك', why:''},
 Q('goals','وش أهم ٣ أشياء {تبي تشتغل|تبين تشتغلين} عليها هالسنة؟',['طاقة أكثر','وزن','نوم','توتر أقل','لياقة وعضل','قلب وسكر','هرمونات وخصوبة','أبي أعرف أرقامي بس'],{multi:true,max:3}),
];

/* ---------- scoring ---------- */
const A=S.a; const idx=(id)=>{const q=[...QUICK,...DEEP].find(x=>x.id===id); return q&&q.opts?q.opts.indexOf(A[id]):-1};
function bmi(){return A.weight/((A.height/100)**2)}
function lifestyleAge(){
  const adj=[]; const b=bmi();
  let bAdj = b<25?-1:b<30?1:b<35?3:5; let wAdj=0;
  if(A.waist&&A.height){const r=A.waist/A.height; wAdj=r>0.6?4:r>0.5?2:0}
  if(wAdj>bAdj) adj.push(['waist',wAdj,'محيط خصرك أعلى من نص طولك','الأنسولين، HOMA-IR، الدهون الثلاثية']); else adj.push(['bmi',bAdj,b<25?'وزنك في المدى الصحي':'وزنك فوق المدى الصحي','الأنسولين، HOMA-IR، الدهون']);
  const sl=[2.5,1.5,0,-1,2.5][idx('sleep')]; adj.push(['sleep',sl,sl>0?'نومك أقل من ٦ ساعات (أو أكثر من ٩)':'نومك في المدى الصحي','HbA1c، hs-CRP']);
  const ac=[2.5,0.5,-1.5,-3][idx('active')]; adj.push(['active',ac,ac>0?'حركتك أقل من اللي يحتاجه جسمك':'حركتك ممتازة','HDL، الدهون الثلاثية، الأنسولين']);
  const sw=[-0.5,0,1,2,2][idx('sweet')]; adj.push(['sweet',sw,sw>0?'المشروبات المحلاة في يومك':'{ما تشرب|ما تشربين} مشروبات محلاة','HbA1c، حمض اليوريك، الدهون الثلاثية']);
  const sm=[0,0.5,2,6][idx('smoke')]; adj.push(['smoke',sm,sm>=2?'التدخين':'{ما تدخن|ما تدخنين}','hs-CRP، الدهون، CK']);
  const st=[-0.5,-0.5,0,1.5,1.5][idx('stress')]; adj.push(['stress',st,st>0?'التوتر اللي ما يروح':'توترك تحت السيطرة','hs-CRP، الكورتيزول، الغدة']);
  const f=A.fam||[]; let fa=0; if(f.includes('سكري'))fa+=1; if(f.includes('جلطة قلب أو دماغ قبل سن ٦٠'))fa+=1.5;
  let total=adj.reduce((s,x)=>s+x[1],0); total=Math.max(-12,Math.min(12,total+fa));
  return {total:Math.round(total*2)/2, adj:adj.sort((p,q)=>q[1]-p[1]), fam:fa};
}
const n2a=n=>String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function scores(){
  const out=[]; const b=bmi();
  const psqi=[idx('sl_lat'),3-idx('sl_fresh'),[3,2,1,0,2][idx('sleep')]].reduce((s,x)=>s+Math.max(0,x),0);
  out.push(['نومك',psqi<=2?'good':psqi<=4?'warn':'act','مؤشر جودة النوم المختصر']);
  const sb=(A.sl_snore==='نعم')+(idx('sl_day')<=1)+(A.sl_apnea==='نعم')+(A.bp==='مرتفع')+(b>35)+(A.age>50)+(A.sex==='رجل');
  out.push(['تنفسك بالنوم',sb<3?'good':sb<5?'warn':'act','STOP-Bang: '+n2a(sb)+' من ٨']);
  const met=[0,1,2,3,4,5][idx('mv_vig')]*8*30+[0,1,2,3,4,5][idx('mv_mod')]*4*30;
  out.push(['حركتك',met>=1500?'good':met>=600?'warn':'act','IPAQ ≈ '+n2a(met)+' MET-دقيقة/أسبوع']);
  const med=(idx('nu_veg')>=2)+(idx('nu_fruit')>=2)+(idx('nu_meat')<=1)+(idx('nu_fish')>=1)+(idx('nu_out')<=1)+(idx('sweet')<=1)+(idx('nu_dates')===1);
  out.push(['أكلك',med>=5?'good':med>=3?'warn':'act','MEDAS مُعدَّل: '+n2a(med)+' من ٧']);
  const pss=idx('stress')+idx('ps1')+(4-idx('ps2'))+(4-idx('ps3'));
  out.push(['ضغطك النفسي',pss<=5?'good':pss<=9?'warn':'act','PSS-4: '+n2a(pss)+' من ١٦']);
  const phq2=idx('phq1')+idx('phq2'); const phq9=phq2+['phq3','phq4','phq5','phq6','phq7','phq8','phq9'].reduce((s,k)=>s+Math.max(0,idx(k)),0);
  out.push(['مزاجك',phq2<3?'good':phq9<10?'warn':'act',phq2<3?'PHQ-2 ضمن الطبيعي':'PHQ-9: '+n2a(phq9)]);
  const gad2=idx('gad1')+idx('gad2'); const gad7=gad2+['gad3','gad4','gad5','gad6','gad7'].reduce((s,k)=>s+Math.max(0,idx(k)),0);
  out.push(['قلقك',gad2<3?'good':gad7<10?'warn':'act',gad2<3?'GAD-2 ضمن الطبيعي':'GAD-7: '+n2a(gad7)]);
  const lo=3+idx('lo1')+idx('lo2')+idx('lo3');
  out.push(['تواصلك',lo<6?'good':'warn','UCLA-3: '+n2a(lo)+' من ٩']);
  let fr=(A.age<45?0:A.age<55?2:A.age<65?3:4)+(b<25?0:b<30?1:3)+(A.waist?(A.sex==='رجل'?(A.waist<94?0:A.waist<102?3:4):(A.waist<80?0:A.waist<88?3:4)):0)+(idx('active')===0?2:0)+(idx('nu_veg')<1?1:0)+((A.meds||[]).includes('ضغط')?2:0)+((A.dx||[]).includes('ما قبل السكري')?5:0)+((A.fam||[]).includes('سكري')?3:0);
  out.push(['خطر السكري',fr<7?'good':fr<12?'warn':'act','FINDRISC: '+n2a(fr)+' من ٢٦']);
  const le8=Math.round(([0,0.5,1,1][Math.min(3,idx('smoke'))]===0?100:idx('smoke')===1?75:idx('smoke')===2?50:0)*.25+([0,25,60,100][idx('active')])*.25+([25,50,75,100,75][idx('sleep')])*.25+(Math.min(100,med*14))*.25);

function drawRing(cv,seed,tone){ // organic particle ring
  const dpr=Math.min(2,window.devicePixelRatio||1); const W=cv.clientWidth||300; cv.width=W*dpr; cv.height=W*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr);
  let r0=seed*9301+49297; const rnd=()=>{r0=(r0*9301+49297)%233280;return r0/233280};
  const cx=W/2,cy=W/2,R=W*0.36; const a1=rnd()*6.28,a2=rnd()*6.28,a3=rnd()*6.28;
  const rad=t=>R*(1+0.08*Math.sin(2*t+a1)+0.05*Math.sin(3*t+a2)+0.04*Math.sin(5*t+a3));
  const dots=[]; for(let i=0;i<1100;i++){const t=rnd()*6.283; const spread=(rnd()+rnd()+rnd())/3; const rr=rad(t)*(0.74+spread*0.48); const sz=1+rnd()*3.2*(1-Math.abs(spread-0.5)*1.2); dots.push({t,rr,sz,ph:rnd()*6.28,sp:0.3+rnd()*0.8,a:0.45+rnd()*0.55})}
  const cols=tone==='good'?['#7FE3BD','#C9B8FF','#E6DEFF','#FFFFFF']:tone==='act'?['#FFB3AD','#F2C97E','#E6DEFF','#FFFFFF']:['#A98BFF','#C9B8FF','#E6DEFF','#FFFFFF'];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; let t0=performance.now(); let frames=0;
  function frame(now){ const k=reduce?1:Math.min(1,(now-t0)/1400); g.clearRect(0,0,W,W);
    // glow
    const gl=g.createRadialGradient(cx,cy,R*0.55,cx,cy,R*1.15); gl.addColorStop(0,'rgba(126,87,253,0)'); gl.addColorStop(0.6,'rgba(126,87,253,0.38)'); gl.addColorStop(1,'rgba(126,87,253,0)'); g.fillStyle=gl; g.beginPath(); g.arc(cx,cy,R*1.2,0,6.283); g.fill();
    const tt=now/1000; for(const d of dots){ const e=1-Math.pow(1-k,3); const rr=d.rr*(0.7+0.3*e)+(reduce?0:Math.sin(tt*d.sp+d.ph)*1.6); const x=cx+Math.cos(d.t)*rr,y=cy+Math.sin(d.t)*rr; g.globalAlpha=d.a*e; g.fillStyle=cols[Math.floor(d.a*4)%4]; g.shadowColor='rgba(201,184,255,0.9)'; g.shadowBlur=d.sz>2.6?6:0; g.beginPath(); g.arc(x,y,d.sz,0,6.283); g.fill(); g.shadowBlur=0; }
    g.globalAlpha=1; frames++; if(!reduce&&document.body.contains(cv)&&frames<900) requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
}
